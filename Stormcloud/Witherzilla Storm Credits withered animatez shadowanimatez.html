<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rig Notice</title>
  <style>
    body {
      background-color: #05060a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    .notice {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .subtext {
      font-size: 32px;
      margin-bottom: 40px;
    }
    .signature {
      font-size: 28px;
      font-style: italic;
      color: #9aa4ff;
    }
  </style>
</head>
<body>
  <div class="notice">
    This rig has been temporarily removed because of copyright issues.
  </div>
  <div class="subtext">
    The new rig will be here soon.
  </div>
  <div class="signature">
    – A message from StormAnimatez
  </div>
</body>
</html>
